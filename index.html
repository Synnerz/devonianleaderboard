<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Devonian Leaderboard</title>
    <link href="style.css" rel="stylesheet" type="text/css">
  </head>

  <body>
    <div class="modal" id="modal-proof">
      <div class="modal-content">
        <div class="modal-header">
          <span class="close">&times;</span>
          <h2>Info</h2>
        </div>
        <div class="modal-body" id="modal-body">
          <p>Submitted Youtube Video(s)</p>
        </div>
      </div>
    </div>

    <h1 style="text-align: center; color: white;">
        <span id="floor" style="color: darkred;">M7 </span>
        <span id="type" style="color: gold;">S+ </span>
        Leaderboard 
        <select class="category" name="category" id="categories">
            <optgroup label="S+" style="color: gold;">
                <option value="M7" selected style="color: darkred;"> M7 </option>
                <option value="M6" style="color: darkred;"> M6 </option>
                <option value="M5" style="color: darkred;"> M5 </option>
                <option value="M4" style="color: darkred;"> M4 </option>
                <option value="M3" style="color: darkred;"> M3 </option>
                <option value="M2" style="color: darkred;"> M2 </option>
                <option value="M1" style="color: darkred;"> M1 </option>

                <option value="F7" style="color: red;"> F7 </option>
                <option value="F6" style="color: red;"> F6 </option>
                <option value="F5" style="color: red;"> F5 </option>
                <option value="F4" style="color: red;"> F4 </option>
                <option value="F3" style="color: red;"> F3 </option>
                <option value="F2" style="color: red;"> F2 </option>
                <option value="F1" style="color: red;"> F1 </option>
            </optgroup>
            <optgroup label="Solo Clear" style="color: yellow;">
                <option value="SOLOM7" style="color: darkred;"> M7 </option>
                <option value="SOLOF7" style="color: red;"> F7 </option>
            </optgroup>
        </select>
    </h1>

    <table id="ranking">
        <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Time</th>
            <th>Date</th>
            <th>&AMP;</th>
        </tr>
    </table>
  </body>
</html>

<script src="js.js"></script>
